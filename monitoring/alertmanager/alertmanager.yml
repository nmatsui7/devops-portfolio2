global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"
  routes:
    - match:
        severity: critical
      receiver: "critical"

receivers:
  - name: "default"
    slack_configs:
      - api_url: "https://hooks.slack.com/services/T00/XXX/YYY"
        channel: "#alerts"
        send_resolved: true
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.summary }}'

  - name: "critical"
    slack_configs:
      - api_url: "https://hooks.slack.com/services/T00/XXX/YYY"
        channel: "#critical"
        send_resolved: true
        title: '[CRITICAL] {{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.summary }}'
