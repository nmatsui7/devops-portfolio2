global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "portfolio-app"
    static_configs:
      - targets: ["app:8000"]
    metrics_path: /metrics

  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

rule_files:
  - alerts.yml
