---
services:
  app:
    build: ../app
    container_name: portfolio-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://portfolio:portfolio@postgres:5432/portfolio
      OTEL_SERVICE_NAME: portfolio-app
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: portfolio-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: portfolio-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus:/etc/prometheus
    networks:
      - portfolio-net

  grafana:
    image: grafana/grafana:11.0.0
    container_name: portfolio-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ../monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - portfolio-net

  loki:
    image: grafana/loki:3.0.0
    container_name: portfolio-loki
    ports:
      - "3100:3100"
    volumes:
      - ../monitoring/loki:/etc/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - portfolio-net

  promtail:
    image: grafana/promtail:3.0.0
    container_name: portfolio-promtail
    volumes:
      - ../monitoring/promtail:/etc/promtail
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    networks:
      - portfolio-net

  tempo:
    image: grafana/tempo:2.4.0
    container_name: portfolio-tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ../monitoring/tempo:/etc/tempo
    command: -config.file=/etc/tempo/tempo-config.yml
    networks:
      - portfolio-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: portfolio-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ../monitoring/alertmanager:/etc/alertmanager
    command: --config.file=/etc/alertmanager/alertmanager.yml
    networks:
      - portfolio-net

networks:
  portfolio-net:
    driver: bridge

volumes:
  pgdata:
