---
- name: Practice Ansible over SSH with a Docker Linux target
  hosts: workers
  gather_facts: true

  tasks:
    - name: Show remote hostname
      ansible.builtin.command: hostname
      changed_when: false
      register: hostname_result

    - name: Print hostname
      ansible.builtin.debug:
        var: hostname_result.stdout

    - name: Create a practice directory
      ansible.builtin.file:
        path: /home/ansible/ansible-practice
        state: directory
        mode: "0755"

    - name: Create a practice file over SSH
      ansible.builtin.copy:
        dest: /home/ansible/ansible-practice/hello.txt
        content: |
          Hello from Ansible.
          This file was created over SSH inside a Docker Linux container.
        mode: "0644"

    - name: Read the practice file
      ansible.builtin.command: cat /home/ansible/ansible-practice/hello.txt
      changed_when: false
      register: file_result

    - name: Print file contents
      ansible.builtin.debug:
        var: file_result.stdout
