---
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Needed so Trivy SARIF results can be uploaded to GitHub Code Scanning.
permissions:
  contents: read
  packages: write
  actions: read
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nmatsui7/portfolio-app

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check app/
      - name: Lint YAML files
        run: |
          pip install yamllint
          yamllint .github docker infrastructure monitoring argocd
          yamllint \
            helm/portfolio-app/Chart.yaml \
            helm/portfolio-app/values.yaml \
            helm/portfolio-app/values-staging.yaml \
            helm/portfolio-app/values-production.yaml
      - uses: azure/setup-helm@v4
      - name: Validate Helm chart
        run: |
          helm lint helm/portfolio-app
          helm template portfolio-app helm/portfolio-app --values helm/portfolio-app/values.yaml > /tmp/portfolio-app-rendered.yaml
          yamllint /tmp/portfolio-app-rendered.yaml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @stoplight/spectral-cli
      - run: spectral lint helm/portfolio-app/templates/*.yaml || true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt
      - run: pip install -r app/requirements.txt
      - name: Run tests
        run: |
          # CI runs against the solutions to validate the reference implementation
          cp solutions/app/*.py app/
          cp solutions/app/tests/*.py app/tests/
          mkdir -p reports
          pytest app/tests/ --junitxml=reports/pytest.xml --cov=app --cov-report=term
      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: pytest
          path: reports/pytest.xml
          reporter: java-junit

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (from solutions)
        run: docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} -f solutions/app/Dockerfile solutions/app/
      - name: Run Trivy on Docker image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: "sarif"
          output: "trivy-image-results.sarif"
          severity: "HIGH,CRITICAL"
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/chart-testing-action@v2.6.1
      - run: helm lint helm/portfolio-app/
      - run: helm template helm/portfolio-app/ --debug > /dev/null
